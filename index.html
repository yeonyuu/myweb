<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WELCOME</title>

  <link
    rel="stylesheet"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Pretendard", sans-serif;

      background:
        linear-gradient(
          180deg,
          #f8fafc,
          #f4f6f8
        );

      color: #202735;
    }

    .welcome-wrap {
      width: 100%;
      max-width: 520px;

      padding: 40px 20px;

      text-align: center;
    }

    .welcome-title {
      font-size: 36px;
      font-weight: 800;

      margin-bottom: 10px;
    }

    .welcome-subtitle {
      color: #8b94a3;

      font-size: 16px;

      margin-bottom: 34px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .menu-card {
      display: flex;

      align-items: center;
      justify-content: space-between;

      width: 100%;

      padding: 26px 24px;

      border-radius: 18px;

      background: white;

      color: inherit;

      text-decoration: none;

      border:
        1px solid
        rgba(0, 0, 0, 0.05);

      box-shadow:
        0 10px 28px
        rgba(30, 40, 60, 0.06);

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease;
    }

    .menu-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 16px 34px
        rgba(30, 40, 60, 0.10);
    }

    .menu-left {
      text-align: left;
    }

    .menu-title {
      margin-bottom: 7px;

      font-size: 19px;
      font-weight: 800;
    }

    .menu-desc {
      color: #8b94a3;

      font-size: 14px;
    }

    .menu-arrow {
      color: #a0a7b2;

      font-size: 27px;
      font-weight: 300;

      transition:
        transform 0.2s ease;
    }

    .menu-card:hover .menu-arrow {
      transform: translateX(5px);
    }

    .card-menu:hover .menu-title {
      color: #ff678f;
    }

    .ebook-menu:hover .menu-title {
      color: #6195d6;
    }

    @media (max-width: 600px) {
      .welcome-title {
        font-size: 30px;
      }

      .menu-card {
        padding: 22px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="welcome-wrap">

    <h1 class="welcome-title">
      WELCOME
    </h1>

    <p class="welcome-subtitle">
      이동할 페이지를 선택해 주세요.
    </p>

    <div class="menu-list">

      <!-- 편지 -->
      <a
        href="../ecard/"
        class="menu-card card-menu"
      >

        <div class="menu-left">

          <div class="menu-title">
            편지
          </div>

          <div class="menu-desc">
            마음을 담은 카드 만들기
          </div>

        </div>

        <div class="menu-arrow">
          →
        </div>

      </a>


      <!-- 책 뷰어 -->
      <a
        href="../ebook/"
        class="menu-card ebook-menu"
      >

        <div class="menu-left">

          <div class="menu-title">
            책 뷰어
          </div>

          <div class="menu-desc">
            그림책 속 이야기 만나기
          </div>

        </div>

        <div class="menu-arrow">
          →
        </div>

      </a>

    </div>

  </main>

</body>
</html>
