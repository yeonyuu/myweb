<!DOCTYPE html>
<html lang="en">
<head>

    <title>부산은행</title>
    <style>
    
    .header-main {
    display: flex;
    align-items: center;

    }

        padding:8px 14px;

            <a href="#">Global</a>
        </div>

        <!-- 아래쪽 메뉴 -->
        <div class="header-main">

            <nav>
                <a href="#">개인뱅킹</a>
                <a href="#">기업뱅킹</a>
                <a href="#">금융상품</a>
            </nav>

            <div class="buttons">
                <button>⌕ 검색하기</button>
                <button>▦ 전체메뉴</button>
            </div>

        </div>

    </div>

</header>
</body>
</html>
