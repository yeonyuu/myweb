<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>그림책 속으로</title>

  <link
    rel="stylesheet"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Pretendard", sans-serif;
      color: #252a35;
      background: #fffaf5;
      overflow-x: hidden;
    }

    button {
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
    }

    .page.active {
      display: flex;
    }

    /* =========================================================
       버튼
    ========================================================= */

    .main-btn {
      min-width: 122px;
      padding: 15px 30px;

      border-radius: 999px;

      background: linear-gradient(
        90deg,
        #ff678f,
        #ff8cad
      );

      color: white;

      font-size: 17px;
      font-weight: 700;

      box-shadow:
        0 12px 25px
        rgba(255, 103, 143, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .main-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 16px 30px
        rgba(255, 103, 143, 0.32);
    }

    .sub-btn {
      min-width: 110px;
      padding: 13px 24px;

      border-radius: 999px;

      background: #eeeeee;
      color: #3c4655;

      font-size: 15px;
      font-weight: 600;

      transition: 0.2s ease;
    }

    .sub-btn:hover {
      background: #e3e3e3;
    }

    .sub-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* =========================================================
       INTRO
    ========================================================= */

    #introPage {
      align-items: center;
      justify-content: center;

      padding: 28px 20px 38px;

      background:
        radial-gradient(
          circle at 50% 58%,
          #fffefc 0%,
          #fff8fb 45%,
          #f8f3ff 100%
        );

      overflow: hidden;
    }

    .intro-wrap {
      width: 100%;
      max-width: 1180px;

      text-align: center;
    }

    .intro-title {
      margin-bottom: 7px;

      font-size: 44px;
      font-weight: 800;

      color: #202735;
    }

    .intro-subtitle {
      margin-bottom: 5px;

      color: #808696;
      font-size: 17px;
    }

    .intro-stage {
      position: relative;

      width: 1000px;
      max-width: 96vw;
      height: 590px;

      margin: 0 auto;

      overflow: visible;
    }

    /* =========================================================
       빛 효과
    ========================================================= */

    .magic-glow {
      position: absolute;

      left: 50%;
      bottom: 145px;

      width: 560px;
      height: 310px;

      transform:
        translateX(-50%)
        scale(0.4);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 236, 137, 0.86) 0%,
          rgba(255, 244, 183, 0.45) 34%,
          rgba(255, 247, 211, 0.18) 56%,
          rgba(255,255,255,0) 73%
        );

      filter: blur(10px);

      opacity: 0;

      z-index: 1;
    }

    .magic-rays {
      position: absolute;

      left: 50%;
      bottom: 175px;

      width: 520px;
      height: 300px;

      transform:
        translateX(-50%)
        scale(0.35);

      opacity: 0;

      z-index: 2;

      background:
        conic-gradient(
          from 200deg at 50% 100%,

          transparent 0deg,
          rgba(255, 225, 100, 0.44) 10deg,
          transparent 21deg,

          transparent 31deg,
          rgba(255, 240, 158, 0.50) 40deg,
          transparent 52deg,

          transparent 68deg,
          rgba(255, 226, 107, 0.43) 78deg,
          transparent 90deg,

          transparent 108deg,
          rgba(255, 242, 169, 0.49) 120deg,
          transparent 132deg,

          transparent 148deg,
          rgba(255, 225, 100, 0.42) 160deg,
          transparent 180deg
        );

      clip-path:
        polygon(
          10% 0,
          90% 0,
          70% 100%,
          30% 100%
        );
    }

    /* =========================================================
       인트로 책
    ========================================================= */

    .magic-book {
      position: absolute;

      left: 50%;
      bottom: 42px;

      width: 870px;

      transform:
        translateX(-50%)
        translateY(190px);

      opacity: 0;

      z-index: 10;
    }

    .magic-book svg {
      width: 100%;
      height: auto;

      overflow: visible;

      filter:
        drop-shadow(
          0 20px 16px
          rgba(76, 45, 30, 0.13)
        );
    }

    /* =========================================================
       튀어나오는 요소
    ========================================================= */

    .pop-object {
      position: absolute;

      z-index: 30;

      opacity: 0;

      transform:
        translateY(75px)
        scale(0.2);

      filter:
        drop-shadow(
          0 8px 7px
          rgba(60, 50, 80, 0.10)
        );
    }

    .pop-object svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================================================
       구름
    ========================================================= */

    .cloud {
      width: 135px;
      height: 44px;

      border-radius: 999px;

      background:
        linear-gradient(
          #ffffff,
          #edf0f5
        );
    }

    .cloud::before,
    .cloud::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: inherit;
    }

    .cloud::before {
      left: 12px;
      top: -27px;

      width: 62px;
      height: 62px;
    }

    .cloud::after {
      right: 13px;
      top: -35px;

      width: 75px;
      height: 75px;
    }

    .cloud-left {
      left: 73px;
      top: 164px;
    }

    .cloud-right {
      right: 72px;
      top: 175px;
    }

    /* =========================================================
       열기구
    ========================================================= */

    .balloon {
      left: 50%;
      top: 35px;

      width: 150px;
      height: 245px;

      transform:
        translateX(-50%)
        translateY(90px)
        scale(0.2);
    }

    .balloon-top {
      width: 150px;
      height: 168px;

      border-radius:
        50% 50%
        44% 44%;

      background:
        repeating-linear-gradient(
          90deg,

          #df3335 0px,
          #df3335 28px,

          #ffd04c 28px,
          #ffd04c 50px
        );

      box-shadow:
        inset 10px 0
        rgba(255,255,255,0.08),

        inset -10px 0
        rgba(0,0,0,0.05);
    }

    .balloon-lines {
      position: relative;

      width: 78px;
      height: 48px;

      margin: 0 auto;
    }

    .balloon-lines::before,
    .balloon-lines::after {
      content: "";

      position: absolute;

      top: 0;

      width: 2px;
      height: 52px;

      background: #685045;
    }

    .balloon-lines::before {
      left: 19px;
      transform: rotate(7deg);
    }

    .balloon-lines::after {
      right: 19px;
      transform: rotate(-7deg);
    }

    .balloon-basket {
      width: 56px;
      height: 36px;

      margin: -2px auto 0;

      border-radius:
        5px 5px
        12px 12px;

      background: #5a2841;
    }

    /* =========================================================
       검은 선 없는 SVG 요소
    ========================================================= */

    .rocket {
      right: 102px;
      top: 95px;

      width: 92px;
      height: 92px;
    }

    .mini-book {
      left: 125px;
      bottom: 168px;

      width: 72px;
      height: 60px;
    }

    .palette {
      left: 272px;
      bottom: 140px;

      width: 75px;
      height: 70px;
    }

    .music {
      right: 302px;
      bottom: 178px;

      width: 66px;
      height: 66px;
    }

    .elephant {
      right: 135px;
      bottom: 142px;

      width: 90px;
      height: 80px;
    }

    /* =========================================================
       반짝임
    ========================================================= */

    .spark {
      position: absolute;

      color: #ffc94a;

      font-size: 30px;

      z-index: 25;

      opacity: 0;
    }

    .spark-1 {
      left: 260px;
      top: 105px;
    }

    .spark-2 {
      right: 260px;
      top: 120px;
    }

    .spark-3 {
      left: 455px;
      top: 148px;
    }

    .spark-4 {
      right: 380px;
      top: 72px;
    }

    .intro-start {
      position: relative;

      margin-top: -5px;

      opacity: 0;

      z-index: 50;
    }

    /* =========================================================
       INTRO 애니메이션
    ========================================================= */

    .intro-stage.animate .magic-book {
      animation:
        bookRise
        1.15s
        cubic-bezier(.18,.86,.32,1.05)
        0.15s
        forwards;
    }

    .intro-stage.animate .magic-glow {
      animation:
        glowAppear
        1.2s ease
        0.95s
        forwards,

        glowBreath
        2.5s ease-in-out
        2.1s
        infinite;
    }

    .intro-stage.animate .magic-rays {
      animation:
        raysAppear
        0.9s ease
        1.05s
        forwards,

        raysBreath
        2.8s ease-in-out
        2s
        infinite;
    }

    .intro-stage.animate .cloud-left {
      animation:
        objectPop
        .65s ease
        1.35s forwards,

        floatObject
        3.2s ease-in-out
        2.1s infinite;
    }

    .intro-stage.animate .cloud-right {
      animation:
        objectPop
        .65s ease
        1.48s forwards,

        floatObject
        3.4s ease-in-out
        2.2s infinite;
    }

    .intro-stage.animate .balloon {
      animation:
        balloonPop
        .8s ease
        1.58s forwards,

        balloonFloat
        3.2s ease-in-out
        2.5s infinite;
    }

    .intro-stage.animate .rocket {
      animation:
        rocketPop
        .72s ease
        1.72s forwards,

        rocketFloat
        3s ease-in-out
        2.6s infinite;
    }

    .intro-stage.animate .mini-book {
      animation:
        objectPop
        .65s ease
        1.85s forwards,

        floatObject
        3s ease-in-out
        2.55s infinite;
    }

    .intro-stage.animate .palette {
      animation:
        objectPop
        .65s ease
        1.95s forwards,

        floatObject
        3.4s ease-in-out
        2.7s infinite;
    }

    .intro-stage.animate .music {
      animation:
        objectPop
        .65s ease
        2.05s forwards,

        floatObject
        2.9s ease-in-out
        2.8s infinite;
    }

    .intro-stage.animate .elephant {
      animation:
        objectPop
        .65s ease
        2.15s forwards,

        floatObject
        3.2s ease-in-out
        2.9s infinite;
    }

    .intro-stage.animate .spark {
      animation:
        sparkAppear
        .5s ease
        1.9s forwards,

        sparkle
        1.8s ease-in-out
        2.4s infinite;
    }

    .intro-stage.animate + .intro-start {
      animation:
        buttonAppear
        .5s ease
        2.6s forwards;
    }

    /* =========================================================
       책장
    ========================================================= */

    #shelfPage {
      justify-content: center;

      padding:
        44px 20px
        55px;

      background:
        linear-gradient(
          #fffaf4,
          #fff1df
        );
    }

    .shelf-wrap {
      width: 100%;
      max-width: 1160px;
    }

    .shelf-head {
      text-align: center;

      margin-bottom: 32px;
    }

    .shelf-head h2 {
      margin-bottom: 8px;
      font-size: 38px;
    }

    .shelf-head p {
      color: #777d8b;
      font-size: 16px;
    }

    .bookshelf {
      padding:
        38px 35px
        30px;

      border:
        9px solid
        #b9753d;

      border-radius: 26px;

      background:
        linear-gradient(
          180deg,
          #f5d297,
          #efc486
        );

      box-shadow:
        0 18px 38px
        rgba(126, 78, 28, 0.16);
    }

    .book-row {
      display: grid;

      grid-template-columns:
        repeat(2, 230px);

      justify-content: center;

      gap: 90px;

      padding:
        24px 20px
        32px;

      border-bottom:
        23px solid
        #9e6235;

      box-shadow:
        inset 0 -4px
        rgba(255,255,255,0.18);
    }

    .book-card {
      width: 230px;

      text-align: center;

      cursor: pointer;

      transition:
        transform 0.25s ease;
    }

    .book-card:hover {
      transform:
        translateY(-10px)
        scale(1.025);
    }

    .book-cover {
      position: relative;

      width: 188px;
      height: 260px;

      margin: 0 auto;

      padding: 7px;

      border-radius:
        11px 19px
        19px 11px;

      background: white;

      box-shadow:
        0 15px 26px
        rgba(78, 50, 25, 0.2);

      overflow: hidden;
    }

    .book-cover::before {
      content: "";

      position: absolute;

      left: 10px;
      top: 10px;

      width: 5px;
      height:
        calc(100% - 20px);

      border-radius: 999px;

      background:
        rgba(255,255,255,0.52);

      z-index: 2;
    }

    .book-cover img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius:
        7px 15px
        15px 7px;
    }

    .book-info {
      margin-top: 16px;
    }

    .book-info strong {
      display: block;

      min-height: 28px;

      font-size: 19px;
      font-weight: 800;
    }

    .book-info span {
      display: block;

      min-height: 42px;

      margin-top: 7px;

      color: #717783;

      font-size: 14px;
      line-height: 1.5;
    }

    .shelf-bottom {
      text-align: center;

      margin-top: 27px;
    }

    /* =========================================================
       READER
    ========================================================= */

    #readerPage {
      justify-content: center;

      padding:
        25px 20px
        50px;

      background:
        linear-gradient(
          #fffaf5,
          #fff4e9
        );
    }

    .reader-wrap {
      width: 100%;
      max-width: 1240px;
    }

    .reader-head {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 24px;
    }

    .reader-title-box h2 {
      margin-bottom: 6px;

      color: #202735;

      font-size: 34px;
    }

    /* =========================================================
       현재 페이지 / 남은 페이지
    ========================================================= */

    .reader-page-info {
      display: flex;

      align-items: center;

      gap: 15px;

      flex-wrap: wrap;
    }

    .reader-page-info p {
      color: #718096;

      font-size: 15px;
      font-weight: 500;
    }

    #remainPage {
      color: #ff6d94;
      font-weight: 700;
    }

    /* =========================================================
       Reader 열린 책
    ========================================================= */

    .reader-book-shell {
      padding:
        34px 38px;

      border-radius: 35px;

      background:
        linear-gradient(
          180deg,
          #f6d992,
          #eac570
        );

      box-shadow:
        0 25px 42px
        rgba(110, 78, 25, 0.14);
    }

    .reader-book {
      position: relative;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }

    .reader-book::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 5px;
      bottom: 5px;

      width: 20px;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,

          transparent,

          rgba(167, 126, 57, 0.18),

          rgba(255,255,255,0.9),

          rgba(167, 126, 57, 0.18),

          transparent
        );

      z-index: 5;

      pointer-events: none;
    }

    .reader-page {
      position: relative;

      min-height: 560px;

      border-radius: 28px;

      background: #fffdf7;

      box-shadow:
        0 10px 26px
        rgba(85, 65, 28, 0.08);

      overflow: hidden;
    }

    /* =========================================================
       왼쪽 이미지
       ★ 책 페이지 전체를 꽉 채우도록 변경
    ========================================================= */

    .image-page {
      padding: 0;
    }

    .story-image-box {
      width: 100%;
      height: 100%;

      min-height: 560px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 28px;

      overflow: hidden;

      background: none;
    }

    .story-image {
      width: 100%;
      height: 100%;

      min-height: 560px;

      object-fit: cover;

      object-position: center;

      border-radius: 28px;
    }

    /* =========================================================
       오른쪽 글
    ========================================================= */

    .text-page {
      display: flex;

      align-items: center;

      padding:
        55px 50px;
    }

    .story-content {
      width: 100%;
    }

    .story-content h3 {
      margin-bottom: 27px;

      color: #ff6d94;

      font-size: 28px;
      line-height: 1.35;
    }

    .story-content p {
      color: #293447;

      font-size: 21px;
      line-height: 2;

      word-break: keep-all;
    }

    .reader-controls {
      display: flex;

      justify-content: center;

      gap: 16px;

      margin-top: 28px;
    }

    /* =========================================================
       완료
    ========================================================= */

    .finish-panel {
      display: none;

      margin-top: 28px;

      padding: 30px;

      text-align: center;

      border-radius: 23px;

      background: white;

      box-shadow:
        0 12px 28px
        rgba(0,0,0,0.06);
    }

    .finish-panel.show {
      display: block;

      animation:
        finishAppear
        .4s ease;
    }

    .finish-panel h3 {
      margin-bottom: 9px;

      font-size: 27px;
    }

    .finish-panel p {
      margin-bottom: 21px;

      color: #777;
    }

    .finish-buttons {
      display: flex;

      justify-content: center;

      gap: 14px;
    }

    /* =========================================================
       애니메이션
    ========================================================= */

    @keyframes bookRise {
      0% {
        opacity: 0;

        transform:
          translateX(-50%)
          translateY(190px)
          scale(0.84);
      }

      70% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(-9px)
          scale(1.015);
      }

      100% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0)
          scale(1);
      }
    }

    @keyframes glowAppear {
      from {
        opacity: 0;

        transform:
          translateX(-50%)
          scale(0.35);
      }

      to {
        opacity: 1;

        transform:
          translateX(-50%)
          scale(1);
      }
    }

    @keyframes glowBreath {
      0%,
      100% {
        opacity: 0.7;

        transform:
          translateX(-50%)
          scale(0.95);
      }

      50% {
        opacity: 1;

        transform:
          translateX(-50%)
          scale(1.08);
      }
    }

    @keyframes raysAppear {
      from {
        opacity: 0;

        transform:
          translateX(-50%)
          scale(0.35);
      }

      to {
        opacity: 0.9;

        transform:
          translateX(-50%)
          scale(1);
      }
    }

    @keyframes raysBreath {
      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 0.92;
      }
    }

    @keyframes objectPop {
      0% {
        opacity: 0;

        transform:
          translateY(75px)
          scale(0.2);
      }

      70% {
        opacity: 1;

        transform:
          translateY(-8px)
          scale(1.08);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes balloonPop {
      0% {
        opacity: 0;

        transform:
          translateX(-50%)
          translateY(95px)
          scale(0.2);
      }

      70% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(-8px)
          scale(1.06);
      }

      100% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0)
          scale(1);
      }
    }

    @keyframes rocketPop {
      0% {
        opacity: 0;

        transform:
          translateY(85px)
          rotate(-10deg)
          scale(0.2);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          rotate(18deg)
          scale(1);
      }
    }

    @keyframes floatObject {
      0%,
      100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-10px);
      }
    }

    @keyframes balloonFloat {
      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-14px);
      }
    }

    @keyframes rocketFloat {
      0%,
      100% {
        transform:
          translateY(0)
          rotate(18deg);
      }

      50% {
        transform:
          translateY(-11px)
          rotate(13deg);
      }
    }

    @keyframes sparkAppear {
      from {
        opacity: 0;
        transform: scale(0.3);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes sparkle {
      0%,
      100% {
        opacity: 0.4;

        transform:
          scale(0.8)
          rotate(0deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.25)
          rotate(20deg);
      }
    }

    @keyframes buttonAppear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes finishAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {

              "소녀는 추위와 배고픔에 떨며 집 사이의 한 모퉁이에 몸을 웅크렸어요. 성냥을 하나도 팔지 못했기 때문에 집으로 돌아갈 용기가 나지 않았어요. 집 역시 차가운 바람을 제대로 막아주지 못하는 곳이었어요.",

            image:
              "./img/img2.png"
          },


          {
            title:
              "첫 번째 성냥",

            text:
              "소녀는 얼어붙은 손을 녹이고 싶어 성냥 하나를 벽에 그었어요. 작은 불꽃이 밝게 타오르자 눈앞에 따뜻하고 커다란 난로가 나타났어요. 하지만 성냥이 꺼지자 난로도 함께 사라졌어요.",

            image:
              "./img/img3.png"
          },


          {
            title:
              "맛있는 저녁 식사",

            text:
              "두 번째 성냥을 켜자 벽 너머로 따뜻한 방이 보였어요. 하얀 식탁보 위에는 맛있는 음식이 가득했고 구운 거위에서는 김이 피어올랐어요. 그러나 성냥이 꺼지자 다시 차가운 벽만 남았어요.",

            image:
              "./img/img4.png"
          },


          {
            title:
              "크리스마스트리",

            text:
              "또 다른 성냥을 밝히자 소녀의 눈앞에 아름다운 크리스마스트리가 나타났어요. 수많은 촛불과 알록달록한 장식이 반짝였어요. 불꽃이 사라지자 촛불들은 하늘의 별처럼 높이 올라갔어요.",

            image:
              "./img/img5.png"
          },


          {
            title:
              "다시 만난 할머니",

            text:
              "소녀가 성냥 하나를 더 밝히자 그 불빛 속에 자신을 가장 사랑해주었던 할머니가 나타났어요. 소녀는 성냥이 꺼지면 할머니도 사라질까 봐 자신을 데려가 달라고 부탁했어요.",

            image:
              "./img/img6.png"
          },


          {
            title:
              "모든 성냥을 밝히다",

            text:
              "할머니와 계속 함께 있고 싶었던 소녀는 남아 있던 성냥을 모두 밝혔어요. 주변이 낮보다 밝게 빛났고 할머니는 소녀를 따뜻하게 품에 안았어요.",

            image:
              "./img/img7.png"
          },


          {
            title:
              "할머니와 함께",

            text:
              "할머니와 소녀는 추위도 배고픔도 두려움도 없는 곳을 향해 높이 올라갔어요. 새해 아침 사람들은 거리 모퉁이에 앉아 있는 소녀와 거의 다 타버린 성냥들을 발견했어요.",

            image:
              "./img/img8.png"
          }

        ]

      }

    };


    /* =========================================================
       Reader
    ========================================================= */

    let selectedBook = null;
    let currentPage = 0;


    const readerTitle =
      document.getElementById("readerTitle");

    const pageNumber =
      document.getElementById("pageNumber");

    const remainPage =
      document.getElementById("remainPage");

    const chapterTitle =
      document.getElementById("chapterTitle");

    const storyText =
      document.getElementById("storyText");

    const storyImage =
      document.getElementById("storyImage");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const readerControls =
      document.getElementById("readerControls");

    const finishPanel =
      document.getElementById("finishPanel");


    /* =========================================================
       책 선택
    ========================================================= */

    document
      .querySelectorAll(".book-card")
      .forEach(
        function (card) {

          card.addEventListener(
            "click",
            function () {

              const bookId =
                this.dataset.book;

              selectedBook =
                books[bookId];

              currentPage = 0;

              finishPanel.classList.remove(
                "show"
              );

              readerControls.style.display =
                "flex";

              updateReader();

              showPage(
                readerPage
              );

            }
          );

        }
      );


    /* =========================================================
       Reader 업데이트
    ========================================================= */

    function updateReader() {

      if (!selectedBook) {
        return;
      }


      const current =
        selectedBook.pages[
          currentPage
        ];


      const totalPages =
        selectedBook.pages.length;


      const currentPageNumber =
        currentPage + 1;


      const remainCount =
        totalPages -
        currentPageNumber;


      readerTitle.textContent =
        selectedBook.title;


      pageNumber.textContent =
        `현재 페이지 ${currentPageNumber} / 전체 ${totalPages}`;


      remainPage.textContent =
        `남은 페이지 ${remainCount}장`;


      chapterTitle.textContent =
        current.title;


      storyText.textContent =
        current.text;


      storyImage.src =
        current.image;


      prevBtn.disabled =
        currentPage === 0;


      if (
        currentPage ===
        totalPages - 1
      ) {

        nextBtn.textContent =
          "이야기 끝내기 →";

      }

      else {

        nextBtn.textContent =
          "다음 →";

      }

    }


    /* =========================================================
       이전
    ========================================================= */

    prevBtn.addEventListener(
      "click",
      function () {

        if (
          selectedBook &&
          currentPage > 0
        ) {

          currentPage--;

          updateReader();

        }

      }
    );


    /* =========================================================
       다음
    ========================================================= */

    nextBtn.addEventListener(
      "click",
      function () {

        if (!selectedBook) {
          return;
        }


        if (
          currentPage <
          selectedBook.pages.length - 1
        ) {

          currentPage++;

          updateReader();

        }

        else {

          readerControls.style.display =
            "none";

          finishPanel.classList.add(
            "show"
          );

        }

      }
    );


    /* =========================================================
       다시 읽기
    ========================================================= */

    document
      .getElementById("restartBtn")
      .addEventListener(
        "click",
        function () {

          if (!selectedBook) {
            return;
          }


          currentPage = 0;


          finishPanel.classList.remove(
            "show"
          );


          readerControls.style.display =
            "flex";


          updateReader();


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /* =========================================================
       책장으로
    ========================================================= */

    document
      .getElementById("shelfBtn")
      .addEventListener(
        "click",
        function () {

          finishPanel.classList.remove(
            "show"
          );

          showPage(
            shelfPage
          );

        }
      );


    document
      .getElementById("finishShelfBtn")
      .addEventListener(
        "click",
        function () {

          finishPanel.classList.remove(
            "show"
          );

          showPage(
            shelfPage
          );

        }
      );


    restartIntroAnimation();

  </script>

</body>
